<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hostlore — things to do, picked by your host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#15221D; --muted:#5A6A63; --line:#D5DDD8;
  --ocean:#0E5E71; --ocean-ink:#FFFFFF; --aloe:#E0892A; --aloe-soft:#FBEBD6; --good:#2E7D4F; --bad:#B23A3A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1714; --surface:#17221E; --ink:#E6EDE9; --muted:#9BACA4; --line:#2A3934;
    --ocean:#4DB0C6; --ocean-ink:#08201A; --aloe:#F0A64A; --aloe-soft:#3A2A14; --good:#6CC592; --bad:#EE8080;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#17221E; --ink:#E6EDE9; --muted:#9BACA4; --line:#2A3934;
  --ocean:#4DB0C6; --ocean-ink:#08201A; --aloe:#F0A64A; --aloe-soft:#3A2A14; --good:#6CC592; --bad:#EE8080;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:var(--ocean)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--aloe);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:30px}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
nav.main a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--aloe);color:#1b1206;font-size:.75rem;font-weight:600;margin-left:4px;text-align:center}

.refbar{background:var(--aloe-soft);border-bottom:1px solid var(--line);font-size:.92rem}
.refbar .wrap{padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.refbar b{font-weight:600}
.demo-note{font-size:.8rem;color:var(--muted)}

/* hero */
.hero{padding:56px 0 28px;display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:end}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,5.4vw,4.3rem);line-height:.98;letter-spacing:-.035em;margin:0 0 18px;max-width:14ch}
.hero p{font-size:1.1rem;color:var(--muted);max-width:46ch;margin:0}
.aloes{display:flex;align-items:flex-end;gap:14px;justify-content:flex-end;height:180px}
.aloes span{display:block;width:26px;border-radius:14px 14px 4px 4px;background:linear-gradient(var(--aloe),#C4541F);transform-origin:bottom;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.aloes span:nth-child(1){height:52%;animation-delay:.05s}
.aloes span:nth-child(2){height:88%;animation-delay:.15s}
.aloes span:nth-child(3){height:66%;animation-delay:.25s}
.aloes span:nth-child(4){height:100%;animation-delay:.35s}
.aloes span:nth-child(5){height:58%;animation-delay:.45s}
.aloes i{display:block;width:4px;height:100%;background:var(--good);opacity:.5;border-radius:2px}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.aloes span{animation:none}}

/* filters */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:18px 0 22px;border-top:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:var(--ocean-ink)}
.filters select{margin-left:auto;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

/* listings */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:60px}
.exp{background:var(--surface);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;border:1px solid var(--line)}
.exp:hover .art{filter:saturate(1.15)}
.exp .art{aspect-ratio:4/3;display:block}
.exp.feature{grid-column:span 2;flex-direction:row}
.exp.feature .art{aspect-ratio:auto;width:58%;min-height:300px}
.exp .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.exp h3{font-family:var(--display);font-weight:700;font-size:1.22rem;line-height:1.15;margin:0;letter-spacing:-.01em}
.exp.feature h3{font-size:1.8rem}
.meta{color:var(--muted);font-size:.9rem}
.price{margin-top:auto;padding-top:8px;font-weight:600}
.price small{font-weight:400;color:var(--muted)}
.hostpick{align-self:flex-start;background:var(--aloe-soft);color:var(--ink);font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px}
.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}

/* detail */
.back{display:inline-block;margin:22px 0 14px;text-decoration:none;font-weight:500}
.detail{display:grid;grid-template-columns:1.4fr 1fr;gap:36px;padding-bottom:70px;align-items:start}
.detail .art{border-radius:22px;overflow:hidden;aspect-ratio:16/10}
.detail h1{font-family:var(--display);font-size:clamp(2rem,4vw,3rem);line-height:1.02;letter-spacing:-.03em;margin:22px 0 6px}
.detail h2{font-family:var(--display);font-size:1.25rem;margin:28px 0 8px}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0;color:var(--muted)}
.facts b{display:block;color:var(--ink);font-weight:600}
.detail ul{padding-left:20px;margin:0}
.panel{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin-top:0}
label.f{display:block;font-size:.88rem;font-weight:600;margin:12px 0 5px}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{border-top:1px dashed var(--line);margin-top:16px;padding-top:12px;font-size:.93rem}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .strong{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--ocean);color:var(--ocean-ink);text-decoration:none}
.btn.full{width:100%;margin-top:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.88rem;border-radius:10px}
.note{font-size:.85rem;color:var(--muted);margin-top:10px}
.err{color:var(--bad);font-size:.88rem;margin-top:8px}

/* page heads */
.phead{padding:40px 0 20px}
.phead h1{font-family:var(--display);font-size:clamp(2rem,4.5vw,3rem);letter-spacing:-.03em;line-height:1;margin:0 0 8px}
.phead p{color:var(--muted);margin:0;max-width:60ch}
.picker{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.picker select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

/* bookings list */
.blist{display:flex;flex-direction:column;gap:14px;padding-bottom:60px}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.bk h3{margin:0 0 4px;font-family:var(--display);font-size:1.15rem}
.steps{display:flex;gap:0;margin:14px 0 4px;list-style:none;padding:0;flex-wrap:wrap}
.steps li{font-size:.82rem;color:var(--muted);padding:4px 12px 4px 0;display:flex;align-items:center;gap:6px}
.steps li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--good);border-color:var(--good)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now::before{border-color:var(--aloe);background:var(--aloe)}
.status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.status.requested{background:var(--aloe-soft);border-color:transparent}
.status.confirmed{background:color-mix(in srgb,var(--ocean) 18%,transparent);border-color:transparent}
.status.paid,.status.completed{background:color-mix(in srgb,var(--good) 18%,transparent);border-color:transparent}
.status.declined,.status.cancelled,.status.noshow{background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:transparent}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* portals */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:26px}
.stats div{background:var(--surface);padding:16px 18px}
.stats b{display:block;font-family:var(--display);font-size:1.8rem;letter-spacing:-.02em}
.stats span{color:var(--muted);font-size:.88rem}
.split{display:grid;grid-template-columns:1fr 1.4fr;gap:26px;padding-bottom:60px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.card h2{font-family:var(--display);font-size:1.2rem;margin:0 0 10px}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin:10px 0}
.qr img,.qr canvas{display:block}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:.85rem}
h2.sec{font-family:var(--display);font-size:1.3rem;margin:28px 0 12px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:.85rem}
footer .wrap{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--ocean);cursor:pointer;padding:0;text-decoration:underline}

/* print room card */
#printcard{display:none}
@media print{
  body *{visibility:hidden}
  #printcard,#printcard *{visibility:visible}
  #printcard{display:block;position:absolute;inset:0;padding:40px;text-align:center;color:#000;background:#fff}
}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .aloes{justify-content:flex-start;height:90px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .detail,.split{grid-template-columns:1fr}
  .panel{position:static}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .grid{grid-template-columns:1fr}
  .exp.feature{grid-column:auto;flex-direction:column}
  .exp.feature .art{width:100%;min-height:0;aspect-ratio:4/3}
  .exp.feature h3{font-size:1.3rem}
  .filters select{margin-left:0;width:100%}
  .bk{grid-template-columns:1fr}
  .acts{justify-content:flex-start}
  nav.main{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  nav.main a{white-space:nowrap}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">
      <svg viewBox="0 0 22 30" aria-hidden="true"><rect x="9" y="12" width="4" height="18" rx="2" fill="#4E8A5C"/><path d="M11 0c5 4 7 8 7 12a7 7 0 0 1-14 0c0-4 2-8 7-12z" fill="#E0892A"/></svg>
      Hostlore
    </a>
    <nav class="main" id="nav"></nav>
  </div>
</header>
<div id="refbar"></div>
<main id="app"></main>
<footer><div class="wrap">
  <span>Hostlore v1 prototype. Demo data only: operators, prices and bookings are illustrative, and payments are simulated.</span>
  <button class="linkbtn" id="reset">Reset demo data</button>
</div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="printcard"></div>

<script>
/* ---------------- config ---------------- */
const DEPOSIT_RATE = 0.15;   // guest pays this online = total commission
const HOST_RATE = 0.05;      // guesthouse share of the booking value
const REF_DAYS = 30;
const CONFIRM_HOURS = 12;
const PAY_HOURS = 24;

const OPERATORS = [
  {id:"schotia", name:"Schotia Private Game Reserve", area:"Addo"},
  {id:"kariega", name:"Kariega Game Reserve", area:"Kenton-on-Sea"},
  {id:"pumba", name:"Pumba Private Game Reserve", area:"Makhanda"},
  {id:"prodive", name:"Pro Dive", area:"Gqeberha"},
  {id:"raggy", name:"Raggy Charters", area:"Gqeberha"},
  {id:"dunes", name:"Sundays River Sandboarding (demo)", area:"Colchester"},
  {id:"jbaysurf", name:"J-Bay Surf School (demo)", area:"Jeffreys Bay"},
  {id:"baywalks", name:"Bay Heritage Walks (demo)", area:"Gqeberha"},
];
const EXPERIENCES = [
  {id:"schotia-drive", op:"schotia", cat:"safari", title:"Afternoon game drive and bush dinner", dur:"6 hours", price:2950, slots:["13:30"], min:1, max:10, feature:true,
   blurb:"Track lions, elephants and rhino in the late light, then eat around the fire in the bush before the night drive back.",
   inc:["Open-vehicle game drive with ranger","Bush dinner","Night drive on the return"], meet:"Schotia reception gate, off the R335"},
  {id:"kariega-day", op:"kariega", cat:"safari", title:"Big Five day safari", dur:"4 hours", price:2400, slots:["08:00","14:00"], min:1, max:8,
   blurb:"A guided drive through valley bushveld and river country with a good chance of the Big Five.",
   inc:["Guided game drive","Refreshment stop","Park conservation fee"], meet:"Kariega main gate, Kenton-on-Sea"},
  {id:"pumba-morning", op:"pumba", cat:"safari", title:"Morning game drive with brunch", dur:"5 hours", price:2650, slots:["07:00"], min:2, max:10,
   blurb:"Early drive for the best sightings, including the reserve's white lions, then brunch at the lodge.",
   inc:["Guided game drive","Lodge brunch"], meet:"Pumba day-visitor reception, N2 near Makhanda"},
  {id:"prodive-seals", op:"prodive", cat:"ocean", title:"Snorkel with Cape fur seals", dur:"3 hours", price:1150, slots:["08:30","11:30"], min:1, max:12, feature:true,
   blurb:"Boat out into Algoa Bay and float alongside curious young seals. No diving experience needed.",
   inc:["Boat trip","Wetsuit, mask and fins","Guide in the water"], meet:"Pro Dive, Summerstrand"},
  {id:"raggy-cruise", op:"raggy", cat:"ocean", title:"Bay cruise: dolphins and penguins", dur:"2.5 hours", price:950, slots:["09:00","13:00"], min:1, max:20,
   blurb:"Cruise Algoa Bay looking for dolphin pods, African penguins and, in season, whales.",
   inc:["Skippered boat trip","Marine guide commentary"], meet:"Port Elizabeth harbour"},
  {id:"dunes-board", op:"dunes", cat:"adventure", title:"Sandboarding the Sundays River dunes", dur:"2 hours", price:450, slots:["09:00","15:00"], min:2, max:15,
   blurb:"Ride the huge coastal dunes at the mouth of the Sundays River. Beginners welcome.",
   inc:["Board and wax","Instructor","Short 4x4 transfer to the dunes"], meet:"Colchester, next to the river mouth"},
  {id:"jbay-surf", op:"jbaysurf", cat:"adventure", title:"Learn to surf at J-Bay", dur:"2 hours", price:600, slots:["08:00","10:30","14:00"], min:1, max:6,
   blurb:"A small-group lesson on a gentle beach break in South Africa's surf capital.",
   inc:["Soft-top board and wetsuit","Qualified instructor"], meet:"Main Beach, Jeffreys Bay"},
  {id:"bay-walk", op:"baywalks", cat:"culture", title:"Route 67 and Donkin Reserve walk", dur:"2 hours", price:350, slots:["10:00"], min:1, max:14,
   blurb:"Walk the public art trail and hear the stories of Nelson Mandela Bay from a local guide.",
   inc:["Local guide","Coffee stop"], meet:"Donkin Reserve lighthouse"},
];
const GUESTHOUSES = [
  {code:"onthebay", name:"On The Bay B&B", area:"Summerstrand", verified:true},
  {code:"relaxedcity", name:"Relaxed City Living", area:"Gqeberha", verified:true},
  {code:"walmergarden", name:"Walmer Garden House (demo)", area:"Walmer", verified:true},
];
const CATS = {all:"Everything", safari:"Safari", ocean:"Ocean", adventure:"Dunes and surf", culture:"Culture"};
const STATUS_LABEL = {requested:"Waiting for operator", confirmed:"Confirmed, pay deposit", paid:"Booked", completed:"Completed", declined:"Declined", cancelled:"Cancelled", noshow:"No-show"};

/* ---------------- storage ---------------- */
const KEY = "hostlore-v1";
function seed(){
  const d = (n)=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
  const mk=(id,exp,date,people,status,ref,name,daysAgo)=>{const e=EXPERIENCES.find(x=>x.id===exp);const total=e.price*people;
    return {id,expId:exp,date:d(date),slot:e.slots[0],people,name,phone:"+27 82 000 0000",email:"guest@example.com",stayingAt:ref,total,deposit:Math.round(total*DEPOSIT_RATE),status,createdAt:Date.now()-daysAgo*864e5,mine:false}};
  return {
    bookings:[
      mk("HL-1042","prodive-seals",-6,2,"completed","onthebay","Sarah K.",9),
      mk("HL-1051","schotia-drive",-3,2,"completed","onthebay","Tom & Lisa",7),
      mk("HL-1063","raggy-cruise",2,4,"paid","relaxedcity","Naidoo family",2),
      mk("HL-1067","kariega-day",4,2,"paid","onthebay","M. Becker",1),
      mk("HL-1070","prodive-seals",3,3,"requested","walmergarden","J. Mokoena",0.2),
      mk("HL-1071","dunes-board",5,4,"requested","onthebay","Pieterse group",0.1),
    ],
    clicks:{onthebay:38,relaxedcity:12,walmergarden:9},
    ref:null, applications:[]
  };
}
let S;
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed()}catch(e){S=seed()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=n=>"R"+Math.round(n).toLocaleString("en-ZA");
const exp=id=>EXPERIENCES.find(e=>e.id===id);
const op=id=>OPERATORS.find(o=>o.id===id);
const gh=code=>GUESTHOUSES.find(g=>g.code===code);
const fmtDate=s=>new Date(s+"T12:00").toLocaleDateString("en-ZA",{weekday:"short",day:"numeric",month:"short"});
const fmtTime=t=>new Date(t).toLocaleString("en-ZA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600)}
const baseUrl=()=>location.href.split("#")[0].split("?")[0];
function activeRef(){ if(S.ref && Date.now()-S.ref.at < REF_DAYS*864e5 && gh(S.ref.code)) return S.ref.code; return null; }

/* referral capture: ?ref=code or #/...?ref=code */
(function(){
  const q=new URLSearchParams(location.search).get("ref") || (location.hash.match(/[?&]ref=([\w-]+)/)||[])[1];
  if(q && gh(q)){ S.ref={code:q,at:Date.now()}; S.clicks[q]=(S.clicks[q]||0)+1; save(); }
})();

/* ---------------- illustrations ---------------- */
function art(cat,seedN=0){
  const v=seedN%3;
  const sky={safari:["#F6C77A","#E98B3A"],ocean:["#9FD3DE","#3F95AA"],adventure:["#F7D9A6","#E8A95E"],culture:["#C9D8E6","#7FA0BF"]}[cat];
  let scene="";
  if(cat==="safari"){
    scene=`<circle cx="${300+v*60}" cy="120" r="46" fill="#FFE3A8" opacity=".9"/>
    <path d="M0 230 Q200 200 400 225 T800 215 V300 H0z" fill="#B5793A"/>
    <path d="M0 255 Q220 235 420 258 T800 250 V300 H0z" fill="#7C5227"/>
    <rect x="${120+v*40}" y="150" width="7" height="85" fill="#3E2A16"/>
    <ellipse cx="${123+v*40}" cy="148" rx="70" ry="16" fill="#4C6B2E"/>

/* ---------------- routing ---------------- */
function route(){
  const h=location.hash.replace(/^#/,"").split("?")[0]||"/";
  const parts=h.split("/").filter(Boolean);
  renderNav(parts[0]||"");
  renderRefbar();
  const app=$("#app");
  if(!parts.length) app.innerHTML=viewHome();
  else if(parts[0]==="x") app.innerHTML=viewDetail(parts[1]);
  else if(parts[0]==="bookings") app.innerHTML=viewMyBookings();
  else if(parts[0]==="hosts") app.innerHTML=viewHost(parts[1]);
  else if(parts[0]==="operators") app.innerHTML=viewOperator(parts[1]);
  else app.innerHTML=viewHome();
  bind(parts);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

function renderNav(cur){
  const mine=S.bookings.filter(b=>b.mine && ["requested","confirmed"].includes(b.status)).length;
  const pend=S.bookings.filter(b=>b.status==="requested").length;
  const items=[["","Explore"],["bookings","My bookings"+(mine?`<span class="badge">${mine}</span>`:"")],["hosts","For guesthouses"],["operators","For operators"+(pend?`<span class="badge">${pend}</span>`:"")]];
  $("#nav").innerHTML=items.map(([k,l])=>`<a href="#/${k}" ${cur===k?'aria-current="page"':""}>${l}</a>`).join("");
}
function renderRefbar(){
  const r=activeRef();
  $("#refbar").innerHTML=r?`<div class="refbar"><div class="wrap">Recommended by <b>${esc(gh(r).name)}</b>. Book here and your host is credited automatically. <button class="linkbtn" id="clearref">Not staying there?</button></div></div>`:"";
  const c=$("#clearref"); if(c) c.onclick=()=>{S.ref=null;save();route()};
}

  return list.map((e,i)=>`<a class="exp ${showFeature&&e.feature?"feature":""}" href="#/x/${e.id}">

function sumHtml(e,people){
  const total=e.price*people, dep=Math.round(total*DEPOSIT_RATE);
  return `<div><span>${R(e.price)} × ${people}</span><span>${R(total)}</span></div>
    <div class="strong"><span>Deposit after confirmation</span><span>${R(dep)}</span></div>
    <div><span>Paid to operator on the day</span><span>${R(total-dep)}</span></div>`;
}

function stepsHtml(b){
  const order=["requested","confirmed","paid","completed"];
  const names=["Requested","Confirmed","Deposit paid","Completed"];
  const idx=order.indexOf(b.status);
  if(idx<0) return "";
  return `<ol class="steps">${names.map((n,i)=>`<li class="${i<idx||b.status==="completed"?"done":i===idx?"now":""}">${n}</li>`).join("")}</ol>`;
}

    let act="";
    if(b.status==="requested") act=`<span class="note">${esc(o.name)} responds by ${fmtTime(b.createdAt+CONFIRM_HOURS*36e5)}</span><button class="btn warn small" data-cancel="${b.id}">Cancel request</button>`;
    if(b.status==="confirmed") act=`<button class="btn small" data-pay="${b.id}">Pay ${R(b.deposit)} deposit</button><span class="note">Pay by ${fmtTime((b.confirmedAt||Date.now())+PAY_HOURS*36e5)} to keep your spot</span>`;

function viewOperator(id){
  id=id||"prodive"; const o=op(id); if(!o) return "";
  const mine=S.bookings.filter(b=>exp(b.expId).op===id);
  const req=mine.filter(b=>b.status==="requested");

/* ---------------- actions ---------------- */
function setStatus(id,status,msg){const b=S.bookings.find(x=>x.id===id); if(!b) return; b.status=status; if(status==="confirmed") b.confirmedAt=Date.now(); save(); toast(msg); route();}
function nextId(){const n=Math.max(...S.bookings.map(b=>+b.id.split("-")[1]),1000)+1;return "HL-"+n}

function bind(parts){
  document.querySelectorAll("[data-cat]").forEach(c=>c.onclick=()=>{filt.cat=c.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===c));$("#grid").innerHTML=gridHtml()});
  const area=$("#area"); if(area) area.onchange=()=>{filt.area=area.value;$("#grid").innerHTML=gridHtml()};

  const f=$("#reqform");
  if(f){
    const e=exp(parts[1]);
    const upd=()=>$("#sum").innerHTML=sumHtml(e,+$("#people").value); upd();
    $("#people").onchange=upd;
    f.onsubmit=ev=>{
      ev.preventDefault();
      const v=k=>$("#"+k).value.trim();
      const missing=[["date","a date"],["stay","where you're staying"],["name","your name"],["phone","a WhatsApp number"],["email","an email address"]].filter(([k])=>!v(k));
      if(missing.length){$("#err").textContent="Add "+missing.map(m=>m[1]).join(", ")+" to send your request.";return}
      if(!/^\S+@\S+\.\S+$/.test(v("email"))){$("#err").textContent="Check the email address. It should look like name@example.com.";return}
      const people=+v("people"), total=e.price*people;
      const stay=v("stay")==="other"?null:v("stay");
      S.bookings.push({id:nextId(),expId:e.id,date:v("date"),slot:v("slot"),people,name:v("name"),phone:v("phone"),email:v("email"),stayingAt:stay,total,deposit:Math.round(total*DEPOSIT_RATE),status:"requested",createdAt:Date.now(),mine:true});
      save(); toast("Request sent. We'll let you know when it's confirmed."); location.hash="#/bookings";
    };
  }

  document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>setStatus(b.dataset.cancel,"cancelled","Request cancelled"));
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{b.disabled=true;b.textContent="Processing…";setTimeout(()=>setStatus(b.dataset.pay,"paid","Deposit paid. You're booked."),900)});
  document.querySelectorAll("[data-voucher]").forEach(btn=>btn.onclick=()=>{
    const b=S.bookings.find(x=>x.id===btn.dataset.voucher),e=exp(b.expId),o=op(e.op),box=$("#v-"+b.id);
    box.innerHTML=box.innerHTML?"":`<div class="card" style="margin-top:12px;background:var(--bg)"><b>Voucher ${b.id}</b><br>${esc(e.title)} with ${esc(o.name)}<br>${fmtDate(b.date)}, arrive 15 minutes before ${b.slot}<br>Meet at: ${esc(e.meet)}<br>Balance to pay on the day: <b>${R(b.total-b.deposit)}</b></div>`;
  });
  document.querySelectorAll("[data-accept]").forEach(b=>b.onclick=()=>setStatus(b.dataset.accept,"confirmed","Accepted. The guest has been asked to pay the deposit."));
  document.querySelectorAll("[data-decline]").forEach(b=>b.onclick=()=>setStatus(b.dataset.decline,"declined","Declined. The guest will be offered alternatives."));
  document.querySelectorAll("[data-complete]").forEach(b=>b.onclick=()=>setStatus(b.dataset.complete,"completed","Marked completed. Referral commission released."));
  document.querySelectorAll("[data-noshow]").forEach(b=>b.onclick=()=>setStatus(b.dataset.noshow,"noshow","Marked as no-show"));
  document.querySelectorAll("[data-opcancel]").forEach(b=>b.onclick=()=>{if(confirm("Cancel this trip? The guest's deposit will be refunded in full."))setStatus(b.dataset.opcancel,"cancelled","Trip cancelled. Guest deposit refunded.")});

  const gp=$("#ghpick"); if(gp) gp.onchange=()=>location.hash="#/hosts/"+gp.value;
  const opk=$("#oppick"); if(opk) opk.onchange=()=>location.hash="#/operators/"+opk.value;

  const qr=$("#qr");
  if(qr){
    const link=$("#reflink").value, g=gh(parts[1]||GUESTHOUSES[0].code);
    try{ new QRCode(qr,{text:link,width:150,height:150,colorDark:"#15221D",colorLight:"#ffffff"}); }catch(e){ qr.textContent="QR code unavailable offline"; }
    $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(link);toast("Link copied")}catch(e){$("#reflink").select();toast("Select and copy the link")}};
    $("#wa").onclick=async()=>{const m=`Hi! Looking for things to do while you're here? These are our favourite local experiences, and you can request a booking in a minute: ${link}`;try{await navigator.clipboard.writeText(m);toast("WhatsApp message copied")}catch(e){toast("Couldn't copy. Try the link instead.")}};
    $("#print").onclick=()=>{
      const pc=$("#printcard");
      pc.innerHTML=`<h1 style="font-family:var(--display);font-size:40px;margin:0 0 8px">Things to do around the Bay</h1><p style="font-size:20px;margin:0 0 20px">Our favourite local experiences, picked by ${esc(g.name)}</p><div id="pqr" style="display:inline-block"></div><p style="font-size:16px;margin-top:20px">Scan to browse and request a booking. Pay only once it's confirmed.</p>`;
      try{new QRCode($("#pqr"),{text:link,width:260,height:260})}catch(e){}
      setTimeout(()=>window.print(),300);
    };
  }
  const ap=$("#apply");
  if(ap) ap.onsubmit=ev=>{ev.preventDefault();
    const n=$("#apname").value.trim(),l=$("#aplink").value.trim(),em=$("#apemail").value.trim();
    if(!n||!l||!em){$("#aperr").textContent="Fill in all three fields to apply.";return}
    S.applications.push({n,l,em,at:Date.now()});save();ap.reset();$("#aperr").textContent="";toast("Application received. We'll verify and email you within 2 working days.");
  };
}

$("#reset").onclick=()=>{if(confirm("Reset all demo bookings and referrals?")){S=seed();save();location.hash="#/";route();toast("Demo data reset")}};
route();
</script>
</body>
</html>
