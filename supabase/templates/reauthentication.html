<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Your confirmation code</title>
</head>
<body style="margin:0;padding:0;background:#f6f4ef;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Enter this code to confirm it's you.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f4ef;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
        <tr>
          <td style="padding:0 4px 20px;">
            <a href="{{ .SiteURL }}" style="text-decoration:none;"><img src="https://www.hostsays.com/images/email-logo.png" width="150" height="48" alt="HostSays" style="display:block;border:0;width:150px;height:auto;"></a>
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;border-radius:16px;padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e2723;">
            <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:700;color:#1e2723;">Confirm it's you</h1>
            <p style="margin:0 0 16px;font-size:15.5px;line-height:1.55;color:#1e2723;">Enter this code to continue:</p>
            <p style="margin:8px 0 20px;font-size:28px;font-weight:700;letter-spacing:6px;color:#1e2723;">{{ .Token }}</p>
            <p style="margin:0 0 0;font-size:15.5px;line-height:1.55;color:#1e2723;">It expires in a few minutes.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 4px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;line-height:1.5;color:#6b716c;">
            Didn't ask for this? Someone may have your password: change it in your settings.<br><br>
            <strong style="color:#1e2723;">HostSays</strong> · Things to do, recommended by local hosts.<br>
            <a href="{{ .SiteURL }}" style="color:#2d4a3e;">hostsays.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
